name: Test release body from file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v3.0.0
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create release notes file
        run: |
          echo "## Changelog" > /tmp/release-notes.md
          echo "- Feature A added" >> /tmp/release-notes.md
          echo "- Bug B fixed" >> /tmp/release-notes.md

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          tag_name: v3.0.0
          release_name: "Release v3.0.0"
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: false

      - name: Assert action ran with body_path input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed (if real token) or fail with API error
          # In test environment with fake token, we expect failure
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced a definitive outcome"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
