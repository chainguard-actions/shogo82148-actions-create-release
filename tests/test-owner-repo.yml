name: Test owner and repo inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          tag_name: v0.0.1-owner-repo-test
          release_name: Owner Repo Test Release
          body: Testing owner and repo inputs
          owner: actionchain-harness
          repo: nonexistent-test-repo
      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RELEASE_ID: ${{ steps.action.outputs.id }}
          HTML_URL: ${{ steps.action.outputs.html_url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "release_id: $RELEASE_ID"
          echo "html_url: $HTML_URL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RELEASE_ID" ]; then
              echo "FAIL: action succeeded but id output is empty"
              exit 1
            fi
            echo "PASS: got release id '$RELEASE_ID'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (nonexistent repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
