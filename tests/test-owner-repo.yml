name: Test release with owner and repo inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v0.0.1-owner-repo-test
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          tag_name: v0.0.1-owner-repo-test
          release_name: "Test Release with owner/repo"
          body: "This is a test release using owner and repo inputs."
          draft: false
          prerelease: false
          overwrite: true
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
        continue-on-error: true

      - name: Assert action ran with owner and repo inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RELEASE_ID: ${{ steps.action.outputs.id }}
          HTML_URL: ${{ steps.action.outputs.html_url }}
          UPLOAD_URL: ${{ steps.action.outputs.upload_url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "release id: $RELEASE_ID"
          echo "html_url: $HTML_URL"
          echo "upload_url: $UPLOAD_URL"
          # The action either succeeds (real token) or fails with API error (no real token)
          # Either way, the action should have been invoked and produced an outcome
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: action did not produce a valid outcome"
            exit 1
          fi
          echo "PASS: action ran with owner/repo inputs and produced outcome: $OUTCOME"
