name: Test release on explicit owner/repo
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          owner: actionchain-harness
          repo: this-repo-does-not-exist-act-test
          tag_name: v0.0.0-act-test-owner-repo
          release_name: Release v0.0.0-act-test-owner-repo
          body: "Owner/repo test"
      - name: Assert action failed on the nonexistent target repository
        env:
          RESULT_ID: ${{ steps.action.outputs.id }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "id: $RESULT_ID"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for a nonexistent owner/repo, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$RESULT_ID" ]; then
            echo "FAIL: id output should be empty on failure"
            exit 1
          fi
          echo "PASS: action respected owner/repo and failed on nonexistent repo"
