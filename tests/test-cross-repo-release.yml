name: Test cross-repo release (owner and repo inputs)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v0.0.1-test-cross
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          tag_name: v0.0.1-test-cross
          release_name: "Test Cross-Repo Release v0.0.1"
          body: "Test release for cross-repo input coverage"
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          draft: true
          overwrite: true
      - name: Assert action ran with owner and repo inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action may fail due to API/token limitations in test env,
          # but we verify the inputs were accepted (not skipped/unknown).
          # A failure due to missing inputs would show a different error.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with owner and repo inputs"
