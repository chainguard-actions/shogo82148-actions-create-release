name: Test release with body_path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v4.0.0-body-path-test
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create release notes file
        run: |
          cat > /tmp/release-notes.md << 'EOF'
          ## What's Changed
          - Feature A added
          - Bug B fixed
          - Performance improvements
          EOF
          echo "Release notes file created"
          cat /tmp/release-notes.md

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          tag_name: v4.0.0-body-path-test
          release_name: "Body Path Test Release v4.0.0"
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: false
        continue-on-error: true

      - name: Assert body_path release action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RELEASE_ID: ${{ steps.action.outputs.id }}
          HTML_URL: ${{ steps.action.outputs.html_url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "release id: $RELEASE_ID"
          echo "html_url: $HTML_URL"
          # In act without a real token, we expect API failure.
          # On success, verify outputs are populated.
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded — verifying outputs are non-empty"
            if [ -z "$RELEASE_ID" ]; then
              echo "FAIL: expected non-empty release id on success"
              exit 1
            fi
            if [ -z "$HTML_URL" ]; then
              echo "FAIL: expected non-empty html_url on success"
              exit 1
            fi
            echo "PASS: body_path release outputs present"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "Action failed (expected in act without real GitHub token) — PASS"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
