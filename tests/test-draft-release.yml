name: Test draft release creation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test tag
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git tag v0.0.2-test-draft || true

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          tag_name: v0.0.2-test-draft
          release_name: "Draft Test Release v0.0.2"
          body: "This is a draft test release."
          draft: true
          prerelease: false

      - name: Assert action ran (outputs set, or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ID: ${{ steps.action.outputs.id }}
          HTML_URL: ${{ steps.action.outputs.html_url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "id: $ID"
          echo "html_url: $HTML_URL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ID" ]; then
              echo "FAIL: action succeeded but id output is empty"
              exit 1
            fi
            if [ -z "$HTML_URL" ]; then
              echo "FAIL: action succeeded but html_url output is empty"
              exit 1
            fi
            echo "PASS: draft release created with id=$ID"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
