name: Test release notes options inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v0.0.1-notes-test
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          tag_name: v0.0.1-notes-test
          release_name: Release Notes Options Test
          generate_release_notes: true
          notes_start_tag: v0.0.0
          discussion_category_name: General
          draft: true
          overwrite: true
      - name: Assert action ran with notes_start_tag and discussion_category_name inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail due to missing tag, missing discussion category,
          # or API limits in act, but we verify the inputs were accepted
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with notes_start_tag and discussion_category_name inputs"
