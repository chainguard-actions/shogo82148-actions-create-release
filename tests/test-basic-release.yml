name: Test basic release creation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v1.0.0
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create release body file
        run: |
          echo "Release notes for v1.0.0" > /tmp/release-body.txt

      - id: create_release
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          tag_name: v1.0.0-test-basic
          release_name: "Test Release v1.0.0"
          body: "This is a test release created by act."
          draft: false
          prerelease: false

      - name: Assert action ran (outputs present or error is API-related)
        env:
          OUTCOME: ${{ steps.create_release.outcome }}
          RELEASE_ID: ${{ steps.create_release.outputs.id }}
          HTML_URL: ${{ steps.create_release.outputs.html_url }}
          UPLOAD_URL: ${{ steps.create_release.outputs.upload_url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "release id: $RELEASE_ID"
          echo "html_url: $HTML_URL"
          echo "upload_url: $UPLOAD_URL"
          # The action should either succeed (real token) or fail at the API call
          # In either case, the action must have been invoked correctly
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded"
            if [ -z "$RELEASE_ID" ]; then
              echo "FAIL: expected release id to be set on success"
              exit 1
            fi
            if [ -z "$HTML_URL" ]; then
              echo "FAIL: expected html_url to be set on success"
              exit 1
            fi
            if [ -z "$UPLOAD_URL" ]; then
              echo "FAIL: expected upload_url to be set on success"
              exit 1
            fi
            echo "PASS: all outputs present"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "Action failed (expected in act without real GitHub token)"
            echo "PASS: action was invoked correctly"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
