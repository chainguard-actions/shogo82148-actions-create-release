name: Test owner and repo inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v0.0.1-owner-repo-test
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          tag_name: v0.0.1-owner-repo-test
          release_name: Owner Repo Test Release
          body: "Testing owner and repo inputs"
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          draft: true
          overwrite: true
      - name: Assert action ran with owner and repo inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail due to missing tag or API limits in act,
          # but we verify the inputs were accepted (not an input validation error)
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with owner and repo inputs"
