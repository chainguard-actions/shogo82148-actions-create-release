name: Test owner and repo inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          tag_name: v0.0.1-owner-repo-test
          release_name: Owner and Repo Input Test Release
          body: Testing owner and repo inputs
          owner: actions
          repo: toolkit
      - name: Assert action ran (success or graceful failure on non-writable repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          HTML_URL: ${{ steps.action.outputs.html_url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "html_url: $HTML_URL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$HTML_URL" ]; then
              echo "FAIL: action succeeded but html_url output is empty"
              exit 1
            fi
            echo "PASS: release created with html_url=$HTML_URL"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (target repo is not writable or does not exist)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
